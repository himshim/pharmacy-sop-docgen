      "offers": {
        "@type": "Offer",

        "@type": "Person",

    <!-- Styles -->
    <link rel="stylesheet" href="css/ui-responsive.css" />

  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-content">
          <div class="header-left">
            <h1>
              <span class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                  <path d="m9 14 2 2 4-4"></path>
                </svg>
              </span>
              SOPgen
            </h1>
            <p class="header-tagline">Every procedure. Perfectly documented.</p>
          </div>
          <div class="header-right">
            <a href="https://himshim.github.io/" target="_blank" class="credit-link">
              Maintained by @himshim26
            </a>
          </div>
        </div>
      </header>

      <!-- Main Columns -->
      <div class="main-layout">
        <!-- TAB 1: CREATE (Edit controls) -->
        <div class="tab-panel active" id="tab-create">
          <aside class="controls-panel">
            <!-- Department & SOP Selection -->
            <div class="control-section">
              <h2 class="section-title">
                <span class="section-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  </svg>
                </span>
                Selection &amp; Style
              </h2>
              <div class="form-group">
                <label for="departmentSelect">Select Department</label>
                <select id="departmentSelect">
                  <option value="">Choose department...</option>
                </select>
              </div>
              <div class="form-group">
                <label for="sopSelect">Select SOP</label>
                <select id="sopSelect" disabled>
                  <option value="">Choose SOP...</option>
                </select>
              </div>
              <div class="form-group">
                <label for="uploadSopJson">Or Upload Custom SOP (.json)</label>
                <input type="file" id="uploadSopJson" accept=".json" />
              </div>
              <div class="form-group">
                <label for="templateSelect">Template Style</label>
                <select id="templateSelect">
                  <option value="sop-a4-classic">Classic Template</option>
                  <option value="sop-a4-iso">ISO Template</option>
                  <option value="sop-a4-naac">NAAC Template</option>
                  <option value="sop-a4-pci">PCI Template</option>
                  <option value="sop-a4-master-professional">Master Professional (QA)</option>
                </select>
              </div>
              <div class="form-group" style="margin-top: 15px; border-top: 1.5px solid var(--border-color); padding-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                <label for="expertModeToggle" style="margin-bottom: 0; font-weight: 600; color: var(--text-dark);">Expert Mode (All Fields)</label>
                <label class="toggle-switch">
                  <input type="checkbox" id="expertModeToggle" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>

            <!-- Document Control Information -->
            <div class="control-section" id="sectionDocControl">
              <h2 class="section-title">
                <span class="section-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                  </svg>
                </span>
                Document Info
              </h2>
              <div class="form-group">
                <label for="institute">Institute Name</label>
                <input type="text" id="institute" placeholder="Enter institute name" />
              </div>
              <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" placeholder="Enter department" />
              </div>
              <div class="form-group">
                <label for="title">Document Title</label>
                <input type="text" id="title" placeholder="Enter SOP title" />
              </div>
              <div class="form-group">
                <label for="sopNumber">SOP Number</label>
                <input type="text" id="sopNumber" placeholder="e.g., SOP-001" />
              </div>
              <div class="form-group">
                <label for="revisionNo">Revision Number</label>
                <input type="text" id="revisionNo" placeholder="00" />
              </div>
              <div class="form-group">
                <label for="effectiveDate">Effective Date</label>
                <input type="date" id="effectiveDate" />
              </div>
              <div class="form-group">
                <label for="revisionDate">Revision Date</label>
                <input type="date" id="revisionDate" />
              </div>
              <div class="form-group">
                <label for="nextReviewDate">Next Review Date</label>
                <input type="date" id="nextReviewDate" />
              </div>
              <div class="form-group">
                <label for="copyType">Copy Type</label>
                <select id="copyType">
                  <option value="CONTROLLED">Controlled</option>
                  <option value="UNCONTROLLED">Uncontrolled</option>
                </select>
              </div>
            </div>

            <!-- Content Area Editor -->
            <div class="control-section">
              <h2 class="section-title">
                <span class="section-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </span>
                SOP Content
              </h2>
              <div class="form-group">
                <label for="purpose">Purpose</label>
                <textarea id="purpose" placeholder="Enter purpose statement..."></textarea>
              </div>
              <div class="form-group">
                <label for="scope">Scope</label>
                <textarea id="scope" placeholder="Enter scope statement..."></textarea>
              </div>
              <div class="form-group">
                <label for="responsibility">Responsibility</label>
                <textarea id="responsibility" placeholder="Enter responsibility details..."></textarea>
              </div>
              <div class="form-group">
                <label for="procedure">Procedure (One step per line)</label>
                <textarea id="procedure" placeholder="Step 1&#10;Step 2&#10;Step 3..."></textarea>
              </div>
              <div class="form-group">
                <label for="precautions">Safety Precautions (One per line)</label>
                <textarea id="precautions" placeholder="Precaution 1&#10;Precaution 2..."></textarea>
              </div>
              <div class="form-group">
                <label for="applicability">Applicability</label>
                <textarea id="applicability" placeholder="Enter applicability..."></textarea>
              </div>
              <div class="form-group">
                <label for="abbreviations">Abbreviations</label>
                <textarea id="abbreviations" placeholder="Abbreviation definitions..."></textarea>
              </div>
              <div class="form-group">
                <label for="references">References</label>
                <textarea id="references" placeholder="Reference documents/standards..."></textarea>
              </div>
              <div class="form-group">
                <label for="annexures">Annexures</label>
                <textarea id="annexures" placeholder="Annexures list..."></textarea>
              </div>
            </div>

            <!-- Inspection & Compliance Metadata (Optional) -->
            <div class="control-section" id="sectionInspection">
              <h2 class="section-title">
                <span class="section-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                  </svg>
                </span>
                Inspection Details
              </h2>
              
              <!-- PCI Section -->
              <div class="compliance-section group-pci">
                <h3 style="font-size:14px; margin: 10px 0 6px 0; color: var(--primary-color);">Pharmacy Council (PCI)</h3>
                <div class="form-group">
                  <label for="pciCourseCode">PCI Course Code</label>
                  <input type="text" id="pciCourseCode" placeholder="e.g., BP403T" />
                </div>
                <div class="form-group">
                  <label for="pciExperimentRef">Experiment Ref</label>
                  <input type="text" id="pciExperimentRef" placeholder="e.g., Experiment 4" />
                </div>
                <div class="form-group">
                  <label for="pciLabCategory">PCI Lab Category</label>
                  <input type="text" id="pciLabCategory" placeholder="e.g., Pharmaceutics" />
                </div>
                <div class="form-group">
                  <label for="pciDocumentationClause">PCI Documentation Clause</label>
                  <textarea id="pciDocumentationClause" placeholder="Enter PCI compliance clause..."></textarea>
                </div>
              </div>

              <!-- NAAC Section -->
              <div class="compliance-section group-naac">
                <h3 style="font-size:14px; margin: 16px 0 6px 0; color: var(--primary-color);">NAAC Accreditation</h3>
                <div class="form-group">
                  <label for="naacAssetPage">Stock Register Page No</label>
                  <input type="text" id="naacAssetPage" placeholder="e.g., Vol II, Page 45" />
                </div>
                <div class="form-group">
                  <label for="naacLedgerId">Equipment Ledger ID</label>
                  <input type="text" id="naacLedgerId" placeholder="e.g., EQ-PH-098" />
                </div>
                <div class="form-group">
                  <label for="naacLogbookRef">Utilization Logbook ID</label>
                  <input type="text" id="naacLogbookRef" placeholder="e.g., LOG-MB-22" />
                </div>
                <div class="form-group">
                  <label for="naacAmcRef">AMC / Maintenance Log Ref</label>
                  <input type="text" id="naacAmcRef" placeholder="e.g., AMC-2026-08" />
                </div>
                <div class="form-group">
                  <label for="naacCalibrationCert">Calibration Certificate No</label>
                  <input type="text" id="naacCalibrationCert" placeholder="e.g., CAL-9982" />
                </div>
                <div class="form-group">
                  <label for="naacWasteProtocol">Eco-Waste Disposal Protocol</label>
                  <textarea id="naacWasteProtocol" placeholder="Enter eco-waste procedures..."></textarea>
                </div>
                <div class="form-group">
                  <label for="naacReviewClause">NAAC Quality Review Clause</label>
                  <textarea id="naacReviewClause" placeholder="Enter review clause..."></textarea>
                </div>
              </div>

              <!-- ISO Section -->
              <div class="compliance-section group-iso">
                <h3 style="font-size:14px; margin: 16px 0 6px 0; color: var(--primary-color);">ISO Standards</h3>
                <div class="form-group">
                  <label for="isoReferenceStandard">Reference Standards Used</label>
                  <input type="text" id="isoReferenceStandard" placeholder="e.g., USP Standards / NIST Weights" />
                </div>
                <div class="form-group">
                  <label for="isoToleranceLimit">Acceptable Tolerance Limit</label>
                  <input type="text" id="isoToleranceLimit" placeholder="e.g., ±0.1 mg" />
                </div>
                <div class="form-group">
                  <label for="isoCapaAction">ISO CAPA Corrective Action</label>
                  <textarea id="isoCapaAction" placeholder="Enter CAPA triggers..."></textarea>
                </div>
                <div class="form-group">
                  <label for="isoRecordRetentionClause">ISO Records Retention Clause</label>
                  <textarea id="isoRecordRetentionClause" placeholder="Enter retention rules..."></textarea>
                </div>
              </div>

              <!-- cGMP / Industry Section -->
              <div class="compliance-section group-gmp">
                <h3 style="font-size:14px; margin: 16px 0 6px 0; color: var(--primary-color);">cGMP / Industry QA</h3>
                <div class="form-group">
                  <label for="gmpSupersedesId">Supersedes Document ID</label>
                  <input type="text" id="gmpSupersedesId" placeholder="e.g., SOP-QA-022 Rev 03" />
                </div>
                <div class="form-group">
                  <label for="gmpLineClearance">Line Clearance Checklist</label>
                  <textarea id="gmpLineClearance" placeholder="Enter line clearance checks..."></textarea>
                </div>
                <div class="form-group">
                  <label for="gmpCleaningProtocol">Cleaning &amp; Sanitation Protocol</label>
                  <textarea id="gmpCleaningProtocol" placeholder="Enter sanitation steps..."></textarea>
                </div>
                <div class="form-group">
                  <label for="gmpOosDirective">OOS / Deviation Directive</label>
                  <textarea id="gmpOosDirective" placeholder="Enter OOS instructions..."></textarea>
                </div>
                <div class="form-group">
                  <label for="gmpDataIntegrityStamp">ALCOA+ Data Integrity Footnote</label>
                  <textarea id="gmpDataIntegrityStamp" placeholder="Enter data integrity disclaimer..."></textarea>
                </div>
              </div>
            </div>

            <!-- Toggles Card -->
            <div class="control-section">
              <h2 class="section-title">
                <span class="section-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="21" x2="4" y2="14"></line>
                    <line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line>
                    <line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line>
                    <line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                  </svg>
                </span>
                Visibility Toggles
              </h2>
              <div class="toggle-group">
                <div class="toggle-item">
                  <label for="toggleDocControl">Document Control Block</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleDocControl" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleSopNumber">SOP Number Field</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleSopNumber" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleRevisionNo">Revision Number Field</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleRevisionNo" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleEffectiveDate">Effective Date Field</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleEffectiveDate" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleRevisionDate">Revision Date Field</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleRevisionDate" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleNextReviewDate">Next Review Date Field</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleNextReviewDate" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleCopyType">Copy Type Field</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleCopyType" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleApplicability">Applicability Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleApplicability" />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleAbbreviations">Abbreviations Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleAbbreviations" />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleReferences">References Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleReferences" />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item">
                  <label for="toggleAnnexures">Annexures Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleAnnexures" />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-pci">
                  <label for="togglePciDetails">PCI Curriculum Details</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="togglePciDetails" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-pci">
                  <label for="togglePciDocumentation">PCI Documentation Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="togglePciDocumentation" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-naac">
                  <label for="toggleNaacDetails">NAAC Asset &amp; Log Details</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleNaacDetails" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-naac">
                  <label for="toggleNaacWaste">NAAC Waste Protocol Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleNaacWaste" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-naac">
                  <label for="toggleNaacReview">NAAC Quality Review Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleNaacReview" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-iso">
                  <label for="toggleIsoCalibration">ISO Calibration &amp; Standards</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleIsoCalibration" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-iso">
                  <label for="toggleIsoCapa">ISO CAPA Corrective Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleIsoCapa" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-iso">
                  <label for="toggleIsoRetention">ISO Records Retention Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleIsoRetention" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-gmp">
                  <label for="toggleGmpClearance">GMP Line Clearance Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleGmpClearance" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-gmp">
                  <label for="toggleGmpCleaning">GMP Cleaning Protocol Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleGmpCleaning" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-gmp">
                  <label for="toggleGmpOos">GMP OOS / Deviation Section</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleGmpOos" checked />
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="toggle-item group-gmp">
                  <label for="toggleGmpFootnote">GMP Data Integrity Footnote</label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="toggleGmpFootnote" checked />
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Approvals Signatures -->
            <div class="control-section">
              <h2 class="section-title">
                <span class="section-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                    <line x1="7" y1="7" x2="7.01" y2="7"></line>
                  </svg>
                </span>
                Approval Signatures
              </h2>
              <div class="form-group">
                <label for="preparedBy">Prepared By (Name)</label>
                <input type="text" id="preparedBy" placeholder="Enter name" />
              </div>
              <div class="form-group">
                <label for="preparedDesig">Prepared By (Designation)</label>
                <input type="text" id="preparedDesig" placeholder="Enter designation" />
              </div>
              <div class="form-group">
                <label for="preparedDate">Prepared Date</label>
                <input type="date" id="preparedDate" />
              </div>
              <div class="form-group">
                <label for="checkedBy">Checked By (Name)</label>
                <input type="text" id="checkedBy" placeholder="Enter name" />
              </div>
              <div class="form-group">
                <label for="checkedDesig">Checked By (Designation)</label>
                <input type="text" id="checkedDesig" placeholder="Enter designation" />
              </div>
              <div class="form-group">
                <label for="checkedDate">Checked Date</label>
                <input type="date" id="checkedDate" />
              </div>
              <div class="form-group">
                <label for="approvedBy">Approved By (Name)</label>
                <input type="text" id="approvedBy" placeholder="Enter name" />
              </div>
              <div class="form-group">
                <label for="approvedDesig">Approved By (Designation)</label>
                <input type="text" id="approvedDesig" placeholder="Enter designation" />
              </div>
              <div class="form-group">
                <label for="approvedDate">Approved Date</label>
                <input type="date" id="approvedDate" />
              </div>
            </div>
          </aside>
        </div>

        <!-- TAB 2: PREVIEW (Visual Render) -->
        <div class="tab-panel" id="tab-preview">
          <!-- Action Bar (Floating Export Toolbar) -->
          <div class="bottom-action-bar">
            <button id="zoom-toggle-btn" class="action-btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
              <span>Fluid View</span>
            </button>
            <button id="browser-print-btn" class="action-btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
              </svg>
              <span>Print</span>
            </button>
            <button id="docx-btn" class="action-btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <path d="M9 15h6"></path>
                <path d="M9 18h6"></path>
                <path d="M9 12h2"></path>
              </svg>
              <span>Word</span>
            </button>
            <button id="print-btn" class="action-btn btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Save PDF</span>
            </button>
          </div>

          <main class="preview-panel">
            <div id="preview-wrapper">
              <div id="preview">
                <!-- Preview A4 content gets rendered here -->
              </div>
            </div>
          </main>
        </div>
      </div>

      <!-- Mobile Bottom Tab Bar -->
      <nav class="tab-navigation">
        <button class="tab-btn active" id="mobile-tab-create" onclick="switchTab(0)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>Edit</span>
        </button>
        <button class="tab-btn" id="mobile-tab-preview" onclick="switchTab(1)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Preview</span>
        </button>
      </nav>

    </div>

    <script src="js/security-sanitizer.js?v=15"></script>
    <script src="js/template-engine.js?v=15"></script>
    <script src="js/sop-engine.js?v=15"></script>

    <!-- Tab Switching Logic (Mobile First) -->
    <script>
      function switchTab(index) {
        // On desktop (≥992px), both panels are always side-by-side — no tab switching needed
        if (window.innerWidth >= 992) return;

        const createTabBtn = document.getElementById("mobile-tab-create");
        const previewTabBtn = document.getElementById("mobile-tab-preview");
        const createPanel = document.getElementById("tab-create");
        const previewPanel = document.getElementById("tab-preview");

        if (index === 0) {
          createTabBtn.classList.add("active");
          previewTabBtn.classList.remove("active");
          createPanel.classList.add("active");
          previewPanel.classList.remove("active");
        } else {
          createTabBtn.classList.remove("active");
          previewTabBtn.classList.add("active");
          createPanel.classList.remove("active");
          previewPanel.classList.add("active");

          // Refresh preview scale now that preview wrapper is visible
          if (window.SOPApp && typeof window.SOPApp.refreshPreview === "function") {
            setTimeout(() => {
              window.SOPApp.refreshPreview();
            }, 30);
          }
        }
      }
    </script>
  </body>
</html>
