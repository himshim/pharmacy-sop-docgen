<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="260" r="170" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" opacity="0.25" />

  <!-- Clipboard Document Sheet -->
  <g filter="url(#shadow)">
    <!-- Backboard -->
    <rect x="116" y="96" width="280" height="340" rx="24" fill="#1E293B" stroke="rgba(255,255,255,0.12)" stroke-width="3" />
    
    <!-- White Paper Sheet -->
    <rect x="136" y="132" width="240" height="284" rx="14" fill="url(#sheetGrad)" />

    <!-- Document Lines -->
    <!-- Line 1 (Heading) -->
    <rect x="166" y="180" width="130" height="14" rx="7" fill="#0F172A" />
    <!-- Line 2 (Emerald Accent Line) -->
    <rect x="166" y="206" width="60" height="6" rx="3" fill="url(#emeraldGrad)" />

    <!-- Line 3 -->
    <rect x="166" y="234" width="180" height="10" rx="5" fill="#CBD5E1" />
    <!-- Line 4 -->
    <rect x="166" y="258" width="160" height="10" rx="5" fill="#CBD5E1" />
    <!-- Line 5 -->
    <rect x="166" y="282" width="175" height="10" rx="5" fill="#CBD5E1" />

    <!-- Mini Table Grid Representation -->
    <rect x="166" y="312" width="180" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <rect x="166" y="312" width="180" height="14" rx="4" fill="#0F172A" />
    <line x1="230" y1="312" x2="230" y2="354" stroke="#E2E8F0" stroke-width="2" />

    <!-- Signature Checkmark / Seal -->
    <circle cx="320" cy="382" r="16" fill="url(#emeraldGrad)" filter="url(#glow)" />
    <path d="M312 382 L317 387 L329 375" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Clip / Clamp -->
  <g filter="url(#shadow)">
    <!-- Clip Base -->
    <rect x="196" y="74" width="120" height="44" rx="12" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
    <!-- Clip Inner Grip -->
    <rect x="226" y="60" width="60" height="28" rx="8" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9" />
    <!-- Clip Screw Detail -->
    <circle cx="256" cy="96" r="4" fill="#0F172A" opacity="0.6" />
  </g>
</svg>
